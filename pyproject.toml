[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equal-dmri"
version = "0.1.0"
description = "EQUAL: equivariant q-space operators with Laplace-measure latents for diffusion MRI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-xdist>=3.3"]
figures = ["matplotlib>=3.7", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 92
target-version = "py310"
